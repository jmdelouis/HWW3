[package]
name = "hww3-grid"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Multi-resolution HEALPix unstructured grids for WAVEWATCH III"
repository = "https://github.com/jmdelouis/HWW3"

[dependencies]
cdshealpix = "0.7"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[profile.release]
opt-level = 3
